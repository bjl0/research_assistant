<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solana launch screener (local)</title>
<style>
:root{
  --color-bg:#ffffff;--color-fg:#1f1e1d;--color-fg-muted:#6b6a68;--color-panel:#f6f5f2;--color-border-line:#dcdad4;
  --color-ok:#1f7a45;--color-bad:#b3261e;--color-warn:#9a6700;
  --cds-gap-xs:.25rem;--cds-gap-sm:.5rem;--cds-gap-md:.875rem;--cds-gap-lg:1.5rem;
  --cds-pad-xs:.25rem;--cds-pad-sm:.5rem;--cds-pad-md:.75rem;--cds-pad-lg:1.125rem;--cds-radius:8px;
  --cds-font-size-caption:.8125rem;--cds-font-size-body:.9375rem;--cds-font-size-heading:1.125rem;--cds-font-size-title:1.75rem;
  --cds-font-weight-medium:600;--cds-dur-slow:.3s;
  --cds-chart-reference:#8a8984;--cds-chart-muted:#b9b7b0;--cds-chart-grid:#e7e5df;--cds-chart-axis:#8a8984;
  --cds-text-secondary:#6b6a68;--cds-surface-popover:#ffffff;--cds-border:#dcdad4;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.14);
  --font-anthropic-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-anthropic-serif:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root{
  --color-bg:#1f1e1d;--color-fg:#f0eee9;--color-fg-muted:#a3a19b;--color-panel:#2a2927;--color-border-line:#43413d;
  --color-ok:#5cc489;--color-bad:#f08c84;--color-warn:#e0b04a;
  --cds-chart-reference:#a3a19b;--cds-chart-muted:#5b5954;--cds-chart-grid:#363431;--cds-chart-axis:#a3a19b;
  --cds-text-secondary:#a3a19b;--cds-surface-popover:#2a2927;--cds-border:#43413d;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.5);}}
html{background:var(--color-bg)}
body{margin:0 auto;max-width:1280px;padding:24px 16px 48px;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans)}
.dash-skeleton{opacity:.55}
.ls-local-bar{margin:0 0 12px;font-size:.8125rem;color:var(--color-fg-muted)}
.sv-bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:0 0 12px;padding:.5rem .75rem;border:1px solid var(--color-border-line);border-radius:8px;background:var(--color-panel);font-size:.8125rem}
.sv-bar button{font:inherit;color:var(--color-fg);background:var(--color-bg);border:1px solid var(--color-border-line);border-radius:8px;padding:.25rem .75rem;cursor:pointer}
.sv-bar button:disabled{opacity:.5;cursor:default}
.sv-bar [hidden]{display:none!important}
.sv-note{color:var(--color-fg-muted)}
.sv-auto{display:inline-flex;align-items:center;gap:.35rem}
.sv-auto input[type=number]{width:4.5rem;font:inherit;color:var(--color-fg);background:var(--color-bg);border:1px solid var(--color-border-line);border-radius:6px;padding:.15rem .4rem}
</style>
</head>
<body>
<p class="ls-local-bar" id="local-bar">Local copy. Data from your own computer's last run.</p>
<div class="sv-bar" id="sv-bar" hidden>
  <button type="button" id="sv-run">Run scan now</button>
  <span class="sv-note" id="sv-status" aria-live="polite"></span>
  <label class="sv-auto"><input type="checkbox" id="sv-sound" checked> Sound on new alerts</label>
  <button type="button" id="sv-test" title="Play the sound once">Test sound</button>
  <label class="sv-auto"><input type="checkbox" id="sv-auto"> Auto scan every <input type="number" id="sv-mins" min="5" max="1440" step="1" value="60"> minutes</label>
  <span class="sv-note" id="sv-next" aria-live="off"></span>
</div>
<!--PAGE-HTML-->
<script>/*D3*/</script>
<script>
// A small stand-in for the claude.ai Dashboard runtime (the `dash` object and the per-viewer store), so the same page
// runs from a file in a browser. Data comes from current/data.js, written by local.py after every run.
(function () {
  const KEY = 'screener-local:';
  const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(KEY + k)); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const state = {tokens: {status: 'loading', data: []}, alerts: {status: 'loading', data: []}};
  const calcs = {}, listeners = [];
  let saved = {}, defaults = {};
  const make = (id) => state[id] || {status: 'ok', data: []};
  const recalc = () => {
    for (const [id, c] of Object.entries(calcs)) {
      const ins = c.inputs.map((i) => (state[i] && state[i].status === 'ok' ? state[i].data : []));
      try { state[id] = {status: 'ok', data: c.fn(...ins)}; } catch (e) { state[id] = {status: 'error', data: []}; }
    }
  };
  const emit = () => { recalc(); for (const f of listeners) f(); };
  // Sound: a short two-note chime made in the browser (no sound file), played when a data load brings an alert that was not
  // there before. The first load of the page never plays. Browsers only allow sound after you have clicked or typed on the
  // page once, so a tab left untouched since it opened may stay silent; Test sound unlocks it.
  let audio = null, known = null;
  const soundOn = () => { const c = lsGet('sound'); return c == null || c.on !== false; };
  const unlock = () => {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
  };
  const chime = () => {
    unlock();
    if (!audio) return;
    const t0 = audio.currentTime + 0.02;
    [[880, 0], [1318.5, 0.16]].forEach(([f, dt]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.5);
      o.connect(g); g.connect(audio.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 0.55);
    });
  };
  window.__screenerSound = {chime, unlock, soundOn, set: (on) => lsSet('sound', {on})};
  for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, unlock, {once: true, capture: true});
  const checkNew = (alerts) => {
    const mints = new Set(alerts.map((a) => a.mint));
    if (known) {
      // only alerts the page would actually show count
      const visible = (a) => !(typeof walletWarning === 'function' && walletWarning(a)) && !(typeof downAlert === 'function' && downAlert(a));
      const fresh = alerts.filter((a) => !known.has(a.mint) && visible(a));
      if (fresh.length && soundOn()) chime();
    }
    known = mints;
  };
  const apply = (d) => {
    defaults = d.params || {};
    state.tokens = {status: 'ok', data: d.tokens || []};
    state.alerts = {status: 'ok', data: d.alerts || []};
    checkNew(state.alerts.data);
    const bar = document.getElementById('local-bar');
    if (bar && d.written_at) bar.textContent = 'Local copy. Last run saved ' + new Date(d.written_at).toLocaleString() + '.';
    const lim = (d.notice && d.notice.limited) || {};
    if (bar && Object.keys(lim).length) {
      bar.textContent += ' RATE LIMITED by ' + Object.keys(lim).join(', ') + ' in the last scan, so alerts may be missing or late. Scan less often (watch 15) until it clears.';
      bar.style.cssText = 'background:#b00020;color:#fff;font-weight:600;padding:.5rem .75rem;border-radius:8px';
    } else if (bar) bar.style.cssText = '';
    emit();
  };
  const load = (after) => {
    const s = document.createElement('script');
    s.src = 'current/data.js?t=' + Date.now();
    s.onload = () => { s.remove(); if (window.__SCREENER_DATA) apply(window.__SCREENER_DATA); if (after) after(); };
    s.onerror = () => {
      s.remove();
      if (state.tokens.status === 'loading') { state.tokens = {status: 'error', data: []}; state.alerts = {status: 'error', data: []}; }
      emit(); if (after) after();
    };
    document.head.appendChild(s);
  };
  saved = lsGet('params') || {};
  window.dash = {
    calc(id, c) { calcs[id] = c; },
    data: (id) => make(id),
    onData(fn) { listeners.push(fn); fn(); load(); },
    params: () => ({...defaults, ...saved}),
    setParams(o) { saved = {...saved, ...o}; lsSet('params', saved); emit(); },
    resetParams() { saved = {}; lsSet('params', saved); emit(); },
    refresh(id, fileOnly) {
      if (!state[id]) return;
      state[id] = {...state[id], refreshing: true};
      const done = (msg) => load(() => {
        for (const k of ['tokens', 'alerts']) state[k] = {...state[k], refreshing: false};
        emit();
        const n = document.getElementById('reload-note');
        if (n && msg) n.textContent = msg;
      });
      if (id !== 'alerts') return;
      // opened through `local.py serve`: fetch fresh prices first; opened as a plain file: just re-read the last run
      if (!fileOnly && (location.protocol === 'http:' || location.protocol === 'https:')) {
        fetch('/api/reprice', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'}).then((r) => r.json())
          .then((j) => done(j.ok ? 'Prices updated just now.' : 'Could not fetch new prices: ' + j.message))
          .catch(() => done('Could not reach the local server, showing the last saved run.'));
      } else if (fileOnly) {
        done();
      } else {
        done('Opened as a file, so this only re-reads the last run. Run  python3 screener/local.py serve  for live prices.');
      }
    },
    colors: ['#3d6fb4', '#c4622d', '#4a8f5d'],
  };
  // "Acted on" marks, kept in this browser
  window.claude = {
    db: {doc: (path) => ({
      get: async () => { const v = lsGet('doc:' + path); return {exists: v != null, data: () => v}; },
      set: async (o) => { lsSet('doc:' + path, o); },
    })},
    user: {id: async () => 'local'},
  };
  // Only when opened through `local.py serve` (http://127.0.0.1): a Run button, and saving the limits for scans.
  const LIMITS = ['max_age_days', 'min_liq', 'min_vol', 'min_holders', 'max_top10', 'max_wallet', 'min_locked', 'no_danger'];
  const api = async (path, body) => {
    const r = await fetch(path, body === undefined ? {cache: 'no-store'} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'The server said no.');
    return j;
  };
  // the sound switch is always shown at the top; the scan controls only when served
  const setupSound = () => {
    const bar = document.getElementById('sv-bar');
    bar.hidden = false;
    for (const id of ['sv-run', 'sv-status', 'sv-auto', 'sv-mins', 'sv-next']) {
      const n = document.getElementById(id);
      (n.closest('label') || n).hidden = true;
    }
    const soundBox = document.getElementById('sv-sound');
    soundBox.checked = window.__screenerSound.soundOn();
    soundBox.addEventListener('change', () => window.__screenerSound.set(soundBox.checked));
    document.getElementById('sv-test').addEventListener('click', () => window.__screenerSound.chime());
  };
  const setupServer = async () => {
    if (location.protocol !== 'http:') return;
    let status;
    try { status = await api('/api/status'); } catch (e) { return; }
    const bar = document.getElementById('sv-bar'), btn = document.getElementById('sv-run'), note = document.getElementById('sv-status');
    for (const id of ['sv-run', 'sv-status', 'sv-auto', 'sv-mins', 'sv-next']) {
      const n = document.getElementById(id);
      (n.closest('label') || n).hidden = false;
    }
    const show = (s) => {
      btn.disabled = s.running;
      btn.textContent = s.running ? 'Scan running…' : 'Run scan now';
      if (s.running) note.textContent = 'Scanning (about a minute). ' + ((s.tail || []).slice(-1)[0] || '');
      else if (s.ok === true) note.textContent = 'Scan finished ' + new Date(s.finished_at).toLocaleTimeString() + '.';
      else if (s.ok === false) note.textContent = 'The scan failed: ' + ((s.tail || []).slice(-3).join(' ') || 'no details');
      else note.textContent = 'Reads new launches and prices, then updates this page.';
    };
    let wasRunning = status.running;
    show(status);
    const poll = async () => {
      try {
        const s = await api('/api/status');
        show(s);
        if (wasRunning && !s.running && s.ok) window.dash.refresh('alerts', true);
        wasRunning = s.running;
      } catch (e) { note.textContent = 'Lost contact with the screener window. Is it still open?'; }
    };
    setInterval(poll, 2000);
    // Auto scan: while this page is open, start a scan every N minutes (not less than 5, so the data sites are not hammered).
    // The choice is remembered in this browser. A scan already running is never doubled up; that tick is skipped.
    const autoBox = document.getElementById('sv-auto'), minsBox = document.getElementById('sv-mins'), nextNote = document.getElementById('sv-next');
    const MIN_MINS = 5;
    const cfg = lsGet('auto') || {};
    autoBox.checked = !!cfg.on;
    minsBox.value = Number.isFinite(cfg.mins) && cfg.mins >= MIN_MINS ? cfg.mins : 60;
    let nextAt = autoBox.checked ? Date.now() + minsBox.value * 60000 : 0;
    const mins = () => Math.min(1440, Math.max(MIN_MINS, Math.round(Number(minsBox.value)) || 60));
    const saveAuto = () => lsSet('auto', {on: autoBox.checked, mins: mins()});
    autoBox.addEventListener('change', () => { nextAt = autoBox.checked ? Date.now() + mins() * 60000 : 0; saveAuto(); });
    minsBox.addEventListener('change', () => { minsBox.value = mins(); if (autoBox.checked) nextAt = Date.now() + mins() * 60000; saveAuto(); });
    setInterval(async () => {
      if (!autoBox.checked) { nextNote.textContent = ''; return; }
      const left = nextAt - Date.now();
      if (left > 0) {
        const m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
        nextNote.textContent = 'Next scan in ' + m + ':' + String(sec).padStart(2, '0') + ' (keep this page and the screener window open)';
        return;
      }
      nextAt = Date.now() + mins() * 60000;
      if (btn.disabled) return;   // a scan is already running
      try { await api('/api/run', {}); wasRunning = true; } catch (e) { note.textContent = 'Auto scan could not start: ' + e.message; }
      poll();
    }, 1000);
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try { await api('/api/run', {}); wasRunning = true; } catch (e) { note.textContent = e.message; }
      poll();
    });
    // next to "Reset to saved values": save the limits now on screen so every future scan uses them
    const reset = document.getElementById('f-reset');
    if (reset) {
      const save = document.createElement('button');
      save.type = 'button'; save.className = reset.className; save.textContent = 'Save these limits for scans';
      const msg = document.createElement('span'); msg.className = 'sv-note'; msg.setAttribute('aria-live', 'polite');
      reset.after(save); save.after(msg);
      save.addEventListener('click', async () => {
        const cur = window.dash.params(), body = {};
        for (const k of LIMITS) if (cur[k] !== undefined) body[k] = cur[k];
        try {
          const saved2 = await api('/api/params', body);
          defaults = {...defaults, ...saved2};
          for (const k of LIMITS) delete saved[k];
          lsSet('params', saved); emit();
          msg.textContent = ' Saved. The next scan uses these limits.';
        } catch (e) { msg.textContent = ' Not saved: ' + e.message; }
      });
    }
  };
  document.addEventListener('DOMContentLoaded', () => {
    setupSound();
    setupServer();
    const asof = (document.getElementById('as-of') || {}).parentElement;
    if (asof) asof.innerHTML = asof.innerHTML.replace(/A scheduled run refreshes this page about once an hour, so prices here can be up to an hour old/,
      'This page shows the last time you ran <code>local.py run</code> on your computer, so prices are as old as that run');
  });
})();
</script>
<script>/*PAGE-JS*/</script>
</body>
</html>
